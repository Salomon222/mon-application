<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionnaire Intelligent</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #4A0E4E;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 1.1rem;
        }
        .language-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        select {
            padding: 6px 10px;
            border-radius: 4px;
            border: none;
            background: white;
            color: #333;
            font-weight: bold;
            cursor: pointer;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 15px;
        }
        .card h2 {
            color: #4A0E4E;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }
        .card p {
            color: #666;
            font-size: 0.95rem;
            line-height: 1.4;
            margin-bottom: 10px;
        }
        input, select.form-control {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .btn-primary {
            background-color: #6200ee;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            font-weight: bold;
            margin-top: 5px;
            transition: background 0.2s;
        }
        .btn-primary:active {
            background-color: #3700b3;
        }
    </style>
</head>
<body>

    <header>
        <h1 id="app-title">Gestionnaire Intelligent</h1>
        <div class="language-container">
            <label for="langSelect" id="label-lang" style="font-size: 0.85rem;">Langue :</label>
            <select id="langSelect" onchange="switchLanguage(this.value)">
                <option value="fr">Français</option>
                <option value="en">English</option>
            </select>
        </div>
    </header>

    <main>
        <div class="card">
            <h2 id="welcome-msg">Bienvenue</h2>
            <p id="desc-msg">Gérez vos ventes, vos stocks et suivez vos activités en toute simplicité depuis votre mobile.</p>
        </div>

        <div class="card">
            <h2 id="sales-title">Enregistrer une vente</h2>
            <input type="text" id="input-product" placeholder="Nom du produit / Product name">
            <input type="number" id="input-price" placeholder="Montant / Price">
            <button class="btn-primary" id="btn-save-sale" onclick="enregistrerVente()">Valider la vente</button>
        </div>

        <div class="card">
            <h2 id="stock-title">État du stock</h2>
            <p id="stock-info">Aucun article enregistré pour le moment.</p>
            <button class="btn-primary" id="btn-manage-stock" onclick="alerteStock()">Gérer les stocks</button>
        </div>
    </main>

    <script>
        // Dictionnaire complet des traductions de l'application
        const translations = {
            fr: {
                appTitle: "Gestionnaire Intelligent",
                labelLang: "Langue :",
                welcome: "Bienvenue",
                description: "Gérez vos ventes, vos stocks et suivez vos activités en toute simplicité depuis votre mobile.",
                salesTitle: "Enregistrer une vente",
                placeholderProduct: "Nom du produit",
                placeholderPrice: "Montant",
                saveSaleBtn: "Valider la vente",
                stockTitle: "État du stock",
                stockInfo: "Aucun article enregistré pour le moment.",
                manageStockBtn: "Gérer les stocks"
            },
            en: {
                appTitle: "Smart Manager",
                labelLang: "Language :",
                welcome: "Welcome",
                description: "Manage your sales, inventory, and track your business easily from your mobile device.",
                salesTitle: "Record a Sale",
                placeholderProduct: "Product name",
                placeholderPrice: "Price",
                saveSaleBtn: "Confirm Sale",
                stockTitle: "Inventory Status",
                stockInfo: "No items registered yet.",
                manageStockBtn: "Manage Stock"
            }
        };

        // Fonction pour changer la langue dynamiquement
        function switchLanguage(lang) {
            localStorage.setItem('app_lang', lang);
            
            // Textes principaux
            document.getElementById('app-title').innerText = translations[lang].appTitle;
            document.getElementById('label-lang').innerText = translations[lang].labelLang;
            document.getElementById('welcome-msg').innerText = translations[lang].welcome;
            document.getElementById('desc-msg').innerText = translations[lang].description;
            
            // Section Ventes
            document.getElementById('sales-title').innerText = translations[lang].salesTitle;
            document.getElementById('input-product').placeholder = translations[lang].placeholderProduct;
            document.getElementById('input-price').placeholder = translations[lang].placeholderPrice;
            document.getElementById('btn-save-sale').innerText = translations[lang].saveSaleBtn;
            
            // Section Stocks
            document.getElementById('stock-title').innerText = translations[lang].stockTitle;
            document.getElementById('stock-info').innerText = translations[lang].stockInfo;
            document.getElementById('btn-manage-stock').innerText = translations[lang].manageStockBtn;
        }

        // Actions interactives basiques
        function enregistrerVente() {
            const produit = document.getElementById('input-product').value;
            const prix = document.getElementById('input-price').value;
            if(!produit || !prix) {
                alert("Veuillez remplir tous les champs !");
                return;
            }
            alert("Vente enregistrée avec succès : " + produit + " (" + prix + " FCFA)");
            document.getElementById('input-product').value = '';
            document.getElementById('input-price').value = '';
        }

        function alerteStock() {
            const currentLang = localStorage.getItem('app_lang') || 'fr';
            if(currentLang === 'en') {
                alert("Inventory management coming soon!");
            } else {
                alert("Module de gestion des stocks bientôt disponible !");
            }
        }

        // Chargement automatique de la langue préférée au démarrage
        window.onload = function() {
            const savedLang = localStorage.getItem('app_lang') || 'fr';
            document.getElementById('langSelect').value = savedLang;
            switchLanguage(savedLang);
        };
    </script>

</body>
</html>
